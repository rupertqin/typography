name: Deploy to Cloudflare Pages

# 只产出一份产物，构建期把前缀烧死为 /typography：
#   父站反代   https://gantz.host/typography/            → 原样转发到 Pages 的同名路径
#   子域访问   https://typography.gantz.host/typography/  → 根路径由 public/_redirects 302 过来
#
# 只发布 Pages、不建同名 Worker：Cloudflare 上同名 Worker 会抢占 <name>.pages.dev 域名。
#
# 需要的仓库 Secrets：
#   CLOUDFLARE_API_TOKEN  —— 权限：Cloudflare Pages:Edit、Account Settings:Read
#   CLOUDFLARE_ACCOUNT_ID —— Cloudflare 控制台右侧栏的 Account ID

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  PAGES_PROJECT: typography
  BASE_PATH: /typography
  PUBLIC_BACK_URL: https://gantz.host

jobs:
  build:
    name: Build static site
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Theme checks + smoke
        run: |
          npm run extract:themes
          npm run check:themes
          npm run smoke

      - name: Build with Astro (base=${{ env.BASE_PATH }})
        run: npm run build

      - name: Verify static output
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -f dist/favicon.svg
          test -f dist/_redirects
          test -f dist/_headers
          test -n "$(find dist/_astro -name '*.js' -print -quit)"
          grep -q "/typography/_astro/" dist/index.html || {
            echo "::error::产物里没有 /typography/_astro/ 前缀，BASE_PATH 未生效"
            exit 1
          }
          if grep -q 'src="/_astro/\|href="/_astro/' dist/index.html; then
            echo "::error::产物里仍有根路径资源引用（/_astro/），父站反代时会与父站资源冲突"
            exit 1
          fi
          echo "dist 文件数: $(find dist -type f | wc -l)"

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 1

  deploy:
    name: Deploy to Cloudflare Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Cloudflare credentials
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            echo "::error::缺少 CLOUDFLARE_API_TOKEN 或 CLOUDFLARE_ACCOUNT_ID，请在仓库 Settings → Secrets and variables → Actions 中配置"
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      # 项目已存在时命令会报错（退出码非 0），在此忽略即可
      - name: Ensure Pages project exists
        run: npx wrangler pages project create "$PAGES_PROJECT" --production-branch=main || true

      - name: Deploy
        run: npx wrangler pages deploy dist --project-name="$PAGES_PROJECT" --branch=main --commit-dirty=true
