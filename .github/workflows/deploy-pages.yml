name: Deploy to GitHub Pages

# 独立发布：https://rupertqin.github.io/Typography/
# 仓库 Settings → Pages → Source 需选 "GitHub Actions"。
#
# 注意 base：GitHub Pages 项目站点挂在仓库名子路径下，所以 BASE_PATH 必须是 /Typography
# （父站 rupertqin.github.io 合并构建时用的是 /typography，两者互不影响）。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  BASE_PATH: /Typography
  SITE_URL: https://rupertqin.github.io/Typography

jobs:
  build:
    name: Build static site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Theme checks + smoke
        run: |
          npm run extract:themes
          npm run check:themes
          npm run smoke

      - name: Build with Astro (base=${{ env.BASE_PATH }})
        run: npm run build

      - name: Verify subpath output
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -f dist/favicon.svg
          grep -q "/Typography/_astro/" dist/index.html || {
            echo "::error::产物里没有 /Typography/_astro/ 前缀，base 未生效"
            exit 1
          }
          echo "dist 文件数: $(find dist -type f | wc -l)"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
