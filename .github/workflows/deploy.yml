name: Deploy

# 一次构建，两处发布：Cloudflare Pages 与 GitHub Pages 项目站点。
# 产物是相对路径的（见 scripts/relativize.mjs），同一份 dist 挂两个路径都能用。
# 项目站点路径 = 仓库名（大小写敏感），需与主站 public/typography/ 同名。
#
# 需要的仓库 Secrets：
#   CLOUDFLARE_API_TOKEN  —— 权限：Cloudflare Pages:Edit、Account Settings:Read
#   CLOUDFLARE_ACCOUNT_ID
# GH Pages 需要仓库 Settings → Pages → Source = "GitHub Actions"。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  PAGES_PROJECT: typography

jobs:
  build:
    name: Build static site
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Theme checks + smoke
        run: |
          npm run extract:themes
          npm run check:themes
          npm run smoke

      - name: Build
        run: npm run build

      - name: Verify mount-agnostic output
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -f dist/favicon.svg
          test -f dist/_headers
          test -n "$(find dist/_astro -name '*.js' -print -quit)"

          if grep -qE '(src|href)="/[^/]' dist/index.html; then
            echo "::error::产物里仍有根绝对引用（/xxx），挂到子路径会 404"
            grep -oE '(src|href)="/[^/][^"]*"' dist/index.html
            exit 1
          fi
          grep -qE '(href|src)="\./_astro/' dist/index.html || {
            echo "::error::没找到相对资源引用（./_astro/…），相对化步骤没生效"
            exit 1
          }
          echo "dist 文件数: $(find dist -type f | wc -l)"

      - name: Upload artifact for Cloudflare
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 1

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy-cloudflare:
    name: Deploy to Cloudflare Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Cloudflare credentials
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            echo "::error::缺少 CLOUDFLARE_API_TOKEN 或 CLOUDFLARE_ACCOUNT_ID，请在仓库 Settings → Secrets and variables → Actions 中配置"
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      # 项目已存在时命令会报错（退出码非 0），在此忽略即可
      - name: Ensure Pages project exists
        run: npx wrangler pages project create "$PAGES_PROJECT" --production-branch=main || true

      - name: Deploy
        run: npx wrangler pages deploy dist --project-name="$PAGES_PROJECT" --branch=main --commit-dirty=true

  deploy-pages:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
